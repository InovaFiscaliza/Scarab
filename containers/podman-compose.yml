x-podman:
  in_pod: false

services:
  db:
    image: "${SCARAB_DB_IMAGE:-localhost/scarab-db:latest}"
    userns_mode: "keep-id:uid=70,gid=70"
    env_file:
      - "${SCARAB_ENV_FILE:?Set SCARAB_ENV_FILE in the Compose environment file}"
    volumes:
      - "${SCARAB_POSTGRES_DIR:?Set SCARAB_POSTGRES_DIR}:/var/lib/postgresql/data:Z"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    image: "${SCARAB_APP_IMAGE:-localhost/scarab-app:latest}"
    userns_mode: "keep-id:uid=999,gid=999"
    env_file:
      - "${SCARAB_ENV_FILE:?Set SCARAB_ENV_FILE in the Compose environment file}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - "${SCARAB_CONFIG_DIR:?Set SCARAB_CONFIG_DIR}:/etc/scarab:ro,Z"
      - "${SCARAB_SHARE01_DIR:?Set SCARAB_SHARE01_DIR}:/mnt/share01:Z"
      - "${SCARAB_SHARE02_DIR:?Set SCARAB_SHARE02_DIR}:/mnt/share02:Z"
      - "${SCARAB_LOG_DIR:?Set SCARAB_LOG_DIR}:/var/log/scarab:Z"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
