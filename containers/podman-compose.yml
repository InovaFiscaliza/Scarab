version: "3.9"

services:
  db:
    build:
      context: ..
      dockerfile: containers/Containerfile.db
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: containers/Containerfile.app
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Application config (read-only): supply repo-local config/config.json.
      - ../config:/app/config:ro
      # Functional test only: replace the host path with a permanent share in production.
      - ../examples/sandbox:/mnt/share01:Z
    restart: unless-stopped

volumes:
  db_data:
