[project]
name = "scarab"
version = "0.0.0"
description = "Scarab - PostgreSQL/Podman architecture (rewrite)"
requires-python = ">=3.13"

dependencies = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2",
    "Office365-REST-Python-Client>=2.3"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.11"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
